<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid{
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-template-columns: repeat(2, 1fr);
            gap: 2em;
        }
        .grid > div{
            font-size: 5vw;
            padding: .5rem;
            background: gold;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="grid">
        <div>One</div>
        <div>Two</div>
        <div>three</div>
        <div>Four</div>
        <div>Five</div>
        <div>Six</div>
        <div>Seven</div>
        <div>Eight</div>
        <div>Nine</div>
        <div>Ten</div>
        <div>Eleven</div>
        <div>Twelve</div>
    </div>

</body>

</html>
