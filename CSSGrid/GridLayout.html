<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: grid;
            grid-template-areas: 
             "nav header header"
             "nav  ads article"
             "nav footer footer";
            grid-template-rows: 60px 1fr 60px;
            grid-template-columns: 20% 1fr 13%;
            grid-gap: 10px;
            height: 100vh;
            margin: 0;
        }
        header,
        footer,
        article,
        nav,
        div{
            padding: 20px;
            background: gold;
        }
        #pageHeader {
            grid-area: header;
        }
        #pageFooter {
            grid-area: footer;
        }
        #mainArticle{
            grid-area: nav;
        }
        #siteAds {
            grid-area: ads;
        }
    </style>
</head>
<body>
    <header id="pageHeader">Header</header>
    <article id="mainArticle">Article</article>
    <nav id="mainNav">Nav</nav>
    <div id="siteAds">Ads</div>
    <footer id="pageFooter">Footer</footer>
</body>
</html>
