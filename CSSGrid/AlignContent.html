<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #grid{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 100px;
            gap: 10px;
            align-content: center;
            height: 100vh;
            background-color: rgba(50, 25, 100, 0.6)
            
        }
        #grid >div{
            padding: 20px;
            font-size: 4vw;
            color: white;
        }
        .red{
            background: orangered;
            height: 20px;
            /* align-self: baseline; */
        }
        .green{
            background: yellowgreen;
            height: 60%;
        }
        .blue{
            background: steelblue;
            height: 40px;
            /* align-self: stretch; */
        }
        body{
            margin: 0px;
        }
    </style>
</head>
<body>
    <div id="grid">
        <div class="red">1</div>
        <div class="green">2</div>
        <div class="blue">3</div>
    </div>
</body>
</html>
