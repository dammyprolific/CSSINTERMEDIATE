<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* portrait and landscape */
        @media only screen and (device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 1) {}

        /* portrait */
        @media only screen and (min-device-width: 768px) and (max-device-height : 1024px) and (-webkit-device-pixel-ratio: 1) {}

        /* landscape */
        @media only screen and (min-device-width: 768px) and (max-device-height: 1024px) and (-webkit-device-pixel-ratio: 1) and (orientation: landscape) {}

        /* ipad 3, 4 and pro 9.7"--------- */
        @media only screen and (min-device-width: 768px) and (max-device-height: 1024px) and (-webkit-device-pixel-ratio: 2) {}

        /* portrait */
        @media only screen and (min-device-width: 768px) and (max-device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) {}

        /* landscape */
        @media screen and (device-width: 320px) and (device-height: 640px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape) {}

        /*----------------- ipad--------------- */
        /* portrait and landscape */
        @media only screen and (min-device-width: 834px) and (max-device-height: 1112px) and (-webkit-device-pixel-ratio: 2) {}

        /* landscape */
        @media only screen and (min-device-width: 834px) and (max-device-height: 834px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape) {}

        @media only screen and (min-device-width: 1112px) and (max-device-height: 1112px) and (orientation: landscape) and (-webkit-min-device-pixel-ratio: 2) {}

        /* ipad pro 12.9"---------- */
        /* portrait and landscape */
        @media only screen and (min-device-width: 1024px) and (max-device-width: 1366px) and (-webkit-min-device-pixel-ratio: 2) {}

        /* portrait */
        @media only screen and (min-device-width:1366pxpx) and (max-device-width:1366px) and (orientation: portrait) and (-webkit-device-pixel-ratio: 2) {}

        /* landscape */
        @media only screen and (min-device-width:1366pxpx) and (max-device-width:1366px) and (orientation: landscape) and (-webkit-device-pixel-ratio: 2) {}
    </style>
</head>
